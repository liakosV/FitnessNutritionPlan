<main class="auth-page">
  <mat-card appearance="outlined" class="auth-card">
    <mat-card-header>
      <mat-card-title>Welcome Back</mat-card-title>
      <mat-card-subtitle>Sign in with your Spring Boot account.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <app-form-error [message]="error" />

        <mat-form-field appearance="outline">
          <mat-label>Username or email</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
          @if (form.controls.username.invalid && form.controls.username.touched) {
            <mat-error>Username or email is required.</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          @if (form.controls.password.invalid && form.controls.password.touched) {
            <mat-error>Password is required.</mat-error>
          }
        </mat-form-field>

        <button mat-flat-button type="submit" [disabled]="loading">
          {{ loading ? 'Signing in...' : 'Login' }}
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <a mat-button routerLink="/auth/register">Create an account</a>
    </mat-card-actions>
  </mat-card>
</main>
